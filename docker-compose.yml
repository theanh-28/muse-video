services:
  muse2api:
    build:
      context: ./runtime/muse2api
    ports:
      - "127.0.0.1:18610:18610"
    volumes:
      - ./runtime/muse2api/data:/app/data
    environment:
      MUSE2API_KEY: "${MUSE2API_KEY:?Set MUSE2API_KEY in your local environment}"
      MUSE2API_HOST: 0.0.0.0
      MUSE2API_PORT: "18610"
      MUSE2API_CONCURRENCY: "1"
    shm_size: "2gb"
    networks:
      - studio-net

  studio:
    profiles:
      - docker-studio
    build:
      context: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
    environment:
      ANISTUDIO_HOME: /app
      ANISTUDIO_HOST: 0.0.0.0
      MUSE2API_BASE_URL: http://muse2api:18610/v1
      MUSE2API_KEY: "${MUSE2API_KEY:?Set MUSE2API_KEY in your local environment}"
      MUSE2API_API_KEY: "${MUSE2API_KEY:?Set MUSE2API_KEY in your local environment}"
      MUSE2API_ALLOW_CONTAINER_NETWORK: "true"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      - muse2api
    networks:
      - studio-net

networks:
  studio-net:
    driver: bridge

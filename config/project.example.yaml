project:
  id: "animation-project-001"
  title: "Untitled Animation"
  language: "vi-VN"
  genre: "to-be-decided"
  visual_style: "to-be-decided"

output:
  aspect_ratio: "16:9"
  target_width: 1920
  target_height: 1080
  target_fps: 30
  container: "mp4"
  video_codec: "libx264"
  audio_codec: "aac"

production:
  target_shot_duration_seconds: 10
  max_concurrent_jobs: 1
  max_retries: 1
  require_approval_before_generation: true
  sequential_continuity_generation: true

provider:
  mode: "manual" # manual | muse2api_experimental | official_api
  base_url: "http://127.0.0.1:18610/v1"
  # API key/session secrets must be stored outside this file, e.g. environment variables.
  api_key_env: "MUSE2API_API_KEY"
  verified_for_submission: false
  supports_image_reference: null
  supports_video_reference: null
  supports_snapshot_continuation: null
  max_duration_seconds: null # probe; do not assume

paths:
  projects_dir: "projects"
  output_dir: "output"

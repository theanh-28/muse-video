[project]
name = "muse-animation-studio"
version = "0.2.0"
description = "Codex-directed Muse video production pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
web = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
anistudio = "animation_studio.cli.main:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animation_studio"]

[tool.hatch.build.targets.wheel.force-include]
"src/animation_studio/studio/static" = "animation_studio/studio/static"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
